name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Clipboard encoder test
        run: .build/debug/KMLinkNative --test-clipboard-gobridge-encode
      - name: Clipboard decoder test
        run: .build/debug/KMLinkNative --test-clipboard-receive-decode

